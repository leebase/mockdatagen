[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mockdatagen"
version = "0.1.0"
description = "TOML-driven mock data generator (SQLite MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mockdatagen = "mockdatagen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
